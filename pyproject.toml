[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-sim"
version = "0.1.0"
description = "Which quantization should I use? One command benchmarks every quant level on YOUR GPU."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "back2matching"}]
keywords = ["llm", "quantization", "benchmark", "ollama", "gpu", "gguf", "vram"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["requests>=2.28.0"]

[project.optional-dependencies]
charts = ["matplotlib"]

[project.urls]
Homepage = "https://github.com/back2matching/quant-sim"

[project.scripts]
quant-sim = "quant_sim.cli:main"

[tool.setuptools.packages.find]
include = ["quant_sim*"]
